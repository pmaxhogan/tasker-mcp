name: Publish

# Every push to main publishes a patch release. The version is computed from
# the registry, never committed back: package.json holds major.minor.0 as the
# floor, and the next version is max(latest published patch + 1, floor).
#
# Auth is npm trusted publishing (OIDC) only: no token is stored anywhere.
# npm is retiring direct publishes from 2FA-bypass tokens (they will only be
# able to stage a release for a human to approve), so a token would turn every
# release into a manual step. The trusted publisher on npmjs.com must allow
# `npm publish`; a stage-only publisher makes this job fail, by design, rather
# than queue a release that waits for approval.
#
# The real publish is armed when the repository variable
# NPM_TRUSTED_PUBLISHING is "true". Without it, the job runs
# `npm publish --dry-run` and skips the tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          # No dependency cache in the release job: a poisoned cache entry
          # would be published.
          registry-url: https://registry.npmjs.org
      # No install scripts in the job that holds the npm credentials.
      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Decide whether trusted publishing is configured
        id: auth
        env:
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED" = "true" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TRUSTED_PUBLISHING is not true; running publish --dry-run only"
          fi

      - name: Compute the next version
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          base=$(node -p "require('./package.json').version")
          latest=$(npm view "$name" version 2>/dev/null || echo 0.0.0)
          next=$(node scripts/next-version.mjs "$latest" "$base")
          echo "latest=$latest base=$base next=$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          npm version "$next" --no-git-tag-version --allow-same-version

      - name: Dry run
        if: steps.auth.outputs.armed != 'true'
        run: npm publish --dry-run --access public

      # npm exchanges the job's OIDC identity for a short-lived publish token
      # and attaches provenance itself. Always `npm publish`, never
      # `npm stage publish`: releases must not wait for a human.
      - name: Publish
        if: steps.auth.outputs.armed == 'true'
        run: npm publish --access public

      - name: Tag the release
        if: steps.auth.outputs.armed == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git tag "v$NEXT"
          git push origin "v$NEXT"
