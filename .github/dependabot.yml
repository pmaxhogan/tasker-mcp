version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    # A release must be a few days old before it is proposed: compromised
    # versions are usually yanked within that window, and minor/patch bumps
    # auto-merge and auto-publish.
    cooldown:
      default-days: 3
    groups:
      # One PR a week for everything non-breaking. Majors stay separate so they
      # get reviewed rather than auto-merged.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the Go-based rewrite and breaks typescript-eslint's
      # peer range. Stay on 6.x until the toolchain supports it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    cooldown:
      default-days: 3
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(actions)"
